<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>DEK NOI Rewards</title>
    <meta name="description" content="Earn points and redeem rewards at DEK NOI Minimart" />
    <meta name="theme-color" content="#CC0000" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="DEK NOI" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <style>
      /* Instant loading screen - shows before React loads */
      #app-loader {
        position: fixed;
        inset: 0;
        background: linear-gradient(135deg, #CC0000 0%, #FF6B6B 50%, #FFE600 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        animation: fadeIn 0.3s ease-in;
      }
      
      #app-loader.loaded {
        display: none;
      }
      
      .loader-logo {
        width: 120px;
        height: 120px;
        animation: bounce 1s ease-in-out infinite;
      }
      
      @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      
      @keyframes bounce {
        0%, 100% { transform: translateY(0) scale(1); }
        50% { transform: translateY(-20px) scale(1.05); }
      }
      
      /* Hide body overflow during load */
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
      }
      
      body.loaded {
        overflow: auto;
      }
    </style>
  </head>
  <body>
    <!-- Instant loading screen - shows immediately -->
    <div id="app-loader">
      <img src="/logo.png" alt="DEK NOI" class="loader-logo" />
    </div>
    
    <div id="root"></div>
    
    <script>
      // Hide loader when React app loads
      window.addEventListener('load', function() {
        setTimeout(function() {
          const loader = document.getElementById('app-loader');
          if (loader) {
            loader.classList.add('loaded');
          }
          document.body.classList.add('loaded');
        }, 100);
      });
    </script>
    
    <script src="https://upload-widget.cloudinary.com/global/all.js" type="text/javascript"></script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
